name: Command secure staging
on:
  push:
    branches: [fix/cloudflare-worker-recovery-20261103]
    paths:
      - ops/cloudflare-secure-staging/**
      - .github/workflows/command-secure-staging.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the separate staging Worker using configured D1 and Access application
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: command-secure-staging
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Authentication and isolation regression tests
        working-directory: ops/cloudflare-secure-staging
        run: |
          node api.test.mjs
          node worker.test.mjs
      - name: Check Cloudflare token and existing resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c07d8b1ea34ea6df240f291062a5ec1f
        run: python3 ops/cloudflare-secure-staging/preflight.py
      - name: Provision separate staging Access and D1
        working-directory: ops/cloudflare-secure-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c07d8b1ea34ea6df240f291062a5ec1f
          COMMAND_STAGING_ALLOWED_EMAIL: ${{ vars.COMMAND_STAGING_ALLOWED_EMAIL }}
        run: python3 provision.py
      - name: Deploy separate staging Worker
        working-directory: ops/cloudflare-secure-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c07d8b1ea34ea6df240f291062a5ec1f
        run: |
          npx --yes wrangler@4 deploy --dry-run --config wrangler.json
          npx --yes wrangler@4 deploy --config wrangler.json
      - name: Verify anonymous requests reach Access login
        run: |
          python3 - <<'PY'
          import time, urllib.request, urllib.error, re
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          for attempt in range(12):
              try:
                  response = opener.open('https://command-app-secure-staging.caring-philodendron.workers.dev/', timeout=15)
                  code, location = response.status, response.headers.get('Location', '')
              except urllib.error.HTTPError as error:
                  code, location = error.code, error.headers.get('Location', '')
                  body = error.read().decode('utf-8', errors='replace')
                  if attempt == 11:
                      title = re.search(r'<title>(.*?)</title>', body, re.S)
                      print('Denial page title:', title.group(1)[:200] if title else 'No HTML title')
                      text = re.sub(r'<[^>]*>', ' ', body)
                      print('Denial excerpt:', re.sub(r'\s+', ' ', text)[:600])
              if code in (301,302,303,307,308) and '.cloudflareaccess.com/' in location:
                  print('Anonymous request redirects to Cloudflare Access login.')
                  break
              if attempt == 11:
                  raise SystemExit(f'Access login redirect not verified: HTTP {code}')
              time.sleep(5)
          PY

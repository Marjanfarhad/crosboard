name: Verify main deployment guard (no deployment)
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/deploy-pages.yml
      - .github/workflows/verify-main-deployment-guard.yml
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert release is manual staging-only and fails closed
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const src=readFileSync('.github/workflows/deploy-pages.yml','utf8');
          assert.match(src,/^  workflow_dispatch:\s*\n    inputs:/m);
          assert.doesNotMatch(src,/^  push:/m);
          assert.match(src,/      target:/);
          assert.match(src,/      approval_phrase:/);
          assert.match(src,/          - secure-staging/);
          assert.doesNotMatch(src,/&& false/);
          const expected = "    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'secure-staging' && inputs.approval_phrase == 'APPROVE-STAGING-ONLY' && vars.COMMAND_STAGING_DEPLOY_APPROVED_20261105 == 'true'";
          for (const name of ['cloud','build','deploy']) {
            assert.ok(src.includes('  '+name+':\n'+expected), name+' must require explicit staging-only dispatch');
          }
          assert.match(src,/Fail closed on missing staging prerequisites and paid AI/);
          assert.match(src,/test -n "\$COMMAND_STAGING_ALLOWED_EMAIL"/);
          assert.match(src,/test -n "\$CLOUDFLARE_API_TOKEN"/);
          assert.match(src,/if \[ "\$COMMAND_ENABLE_LIVE_AI" = "true" \]; then/);
          const guardPos=src.indexOf('Fail closed on missing staging prerequisites and paid AI');
          const provisionPos=src.indexOf('python3 provision.py');
          assert.ok(guardPos>=0 && provisionPos>guardPos,'preflight must precede provisioning');
          const production=JSON.parse(readFileSync('ops/cloudflare-production/wrangler.example.json','utf8'));
          assert.equal(production.name,'command-app-production');
          assert.equal(production.workers_dev,false,'production cannot be public before Access');
          assert.equal(production.preview_urls,false);
          assert.equal(production.vars.AI_ENABLED,'false','paid AI must be disabled');
          assert.equal(production.d1_databases[0].database_name,'command-production');
          assert.equal(production.d1_databases[0].database_id,'dd4f4317-d841-4ed9-a9d1-a8a6582b7ba4');
          assert.equal(production.vars.ACCESS_AUD,'REPLACE_WITH_SEPARATE_PRODUCTION_ACCESS_AUD','production audience must remain an explicit non-secret placeholder until Access exists');
          console.log('PASS: isolated production template is not exposed and keeps paid AI off');
          console.log('PASS: explicit manual staging gate and preflight are present; no deployment triggered');
          JS

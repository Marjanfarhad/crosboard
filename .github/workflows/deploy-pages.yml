name: Deploy CROS to GitHub Pages

on:
  push:
    branches: [main, fix/ai-disabled-safe-deploy-20261104, feat/staging-tiktok-oauth-smoke]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/fix/ai-disabled-safe-deploy-20261104' && github.event.head_commit.message == 'Deploy PR 12 authentication fix to staging once') || (github.ref == 'refs/heads/feat/staging-tiktok-oauth-smoke' && github.event.head_commit.message == 'Deploy TikTok Sandbox OAuth to Command staging')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: command-secure-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec vitest run client/src/lib/cloudWorkspace.test.ts client/src/lib/cloudCsv.test.ts
      - name: Test secure backend
        working-directory: ops/cloudflare-secure-staging
        run: |
          node api.test.mjs
          node worker.test.mjs
          node ai.test.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Test React cloud controls with mock API on desktop and mobile
        env:
          VITE_COMMAND_CLOUD_SYNC: 'true'
        run: pnpm exec playwright test --config playwright.cloud.config.ts
      - name: Build authenticated React frontend
        env:
          VITE_COMMAND_CLOUD_SYNC: 'true'
        run: pnpm build:static
      - name: Configure existing Access application and D1
        if: github.ref == 'refs/heads/main'
        working-directory: ops/cloudflare-secure-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c07d8b1ea34ea6df240f291062a5ec1f
          COMMAND_STAGING_ALLOWED_EMAIL: ${{ vars.COMMAND_STAGING_ALLOWED_EMAIL }}
        run: |
          python3 provision.py
          node live-storage.test.mjs
      - name: Resolve existing staging bindings without provisioning
        if: github.ref != 'refs/heads/main'
        working-directory: ops/cloudflare-secure-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c07d8b1ea34ea6df240f291062a5ec1f
          COMMAND_STAGING_ALLOWED_EMAIL: ${{ vars.COMMAND_STAGING_ALLOWED_EMAIL }}
        run: |
          python3 - <<'PY'
          """Provision only the separately named staging resources; never expose tokens."""
          import json
          import os
          from pathlib import Path
          import urllib.request
          import urllib.error
          
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          email = os.environ.get('COMMAND_STAGING_ALLOWED_EMAIL', '').strip()
          if not email or '@' not in email:
              raise SystemExit('Set repository variable COMMAND_STAGING_ALLOWED_EMAIL before provisioning.')
          base = f'https://api.cloudflare.com/client/v4/accounts/{account}'
          
          def api(path, method='GET', body=None):
              req = urllib.request.Request(base + path, method=method,
                  headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
                  data=None if body is None else json.dumps(body).encode())
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as error:
                  details = json.load(error).get('errors', [])
                  summary = '; '.join(str(item.get('code')) + ': ' + str(item.get('message', ''))[:300] for item in details)
                  raise SystemExit(f'Cloudflare {method} {path}: HTTP {error.code}. {summary}') from None
              if not result.get('success'):
                  raise SystemExit(f'Cloudflare {method} {path} failed.')
              return result['result']
          
          hostname = 'command-app-secure-staging.caring-philodendron.workers.dev'
          apps = api('/access/apps?per_page=1000')
          matches = [app for app in apps if app.get('domain') == hostname]
          if len(matches) != 1 or not matches[0].get('aud'):
              raise SystemExit('Expected one existing staging Access application with an audience.')
          app = matches[0]
          policies = api('/access/apps/' + app['id'] + '/policies')
          if not any(policy.get('decision') == 'allow' and {'email': {'email': email}} in policy.get('include', []) for policy in policies):
              raise SystemExit('Existing staging Access policy differs.')
          databases = api('/d1/database?per_page=100')
          matches = [db for db in databases if db.get('name') == 'command-secure-staging']
          if len(matches) != 1 or not matches[0].get('uuid'):
              raise SystemExit('Expected one existing staging D1 binding.')
          config = json.loads(Path('wrangler.example.json').read_text())
          config['d1_databases'][0]['database_id'] = matches[0]['uuid']
          config['vars']['ACCESS_AUD'] = app['aud']
          config['vars']['AI_ENABLED'] = 'false'
          if os.environ['GITHUB_REF_NAME'] == 'feat/staging-tiktok-oauth-smoke':
              settings = api('/workers/scripts/command-app-secure-staging/settings')
              bindings = {item['name']: item for item in settings.get('bindings', [])}
              key_type = bindings.get('TIKTOK_CLIENT_KEY', {}).get('type', 'missing')
              secret_type = bindings.get('TIKTOK_CLIENT_SECRET', {}).get('type', 'missing')
              print(f'TikTok binding types: client key={key_type}; client secret={secret_type}', flush=True)
              if secret_type != 'secret_text' or key_type not in ('plain_text', 'secret_text'):
                  raise SystemExit('Required TikTok staging bindings are missing or have the wrong type.')
              if bindings.get('DB', {}).get('id') != matches[0]['uuid']:
                  raise SystemExit('Active Worker database does not match the staging database.')
              config['vars']['TIKTOK_OAUTH_ENABLED'] = 'true'
              schema = Path('schema.sql').read_text()
              marker = 'CREATE TABLE IF NOT EXISTS tiktok_oauth_states ('
              if schema.count(marker) != 1:
                  raise SystemExit('TikTok state table definition is missing or ambiguous.')
              sql = marker + schema.split(marker, 1)[1].split(';', 1)[0] + ';'
              api('/d1/database/' + matches[0]['uuid'] + '/query', 'POST', {'sql': sql})
          Path('wrangler.json').write_text(json.dumps(config, indent=2))
          PY
      # Live AI is deliberately disabled for the initial secure release.
      # Re-enabling it requires a separate reviewed workflow change and provider approval.
      - name: Verify AI-disabled release gate (no provider request)
        working-directory: ops/cloudflare-secure-staging
        run: |
          node ai.test.mjs
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const config=JSON.parse(readFileSync('wrangler.json','utf8'));
          assert.notEqual(config.vars?.AI_ENABLED,'true','Live AI must remain disabled');
          console.log('PASS: AI remains disabled; no OpenAI provider request.');
          JS
      - name: Deploy React frontend to the existing secure Command Worker
        working-directory: ops/cloudflare-secure-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c07d8b1ea34ea6df240f291062a5ec1f
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const config=JSON.parse(readFileSync('wrangler.json','utf8'));
          config.vars ??= {};
          config.vars.AI_ENABLED='false';
          writeFileSync('wrangler.json',JSON.stringify(config));
          assert.equal(config.vars.AI_ENABLED,'false');
          console.log('AI disabled for this deployment; no OpenAI key installed.');
          JS
          cp -a ../../dist/public/. public/
          npx --yes wrangler@4 deployments list --config wrangler.json
          npx --yes wrangler@4 deploy --dry-run --config wrangler.json
          npx --yes wrangler@4 deploy --keep-vars --config wrangler.json
      - name: Verify anonymous traffic starts Access login
        run: |
          node --input-type=module - <<'JS'
          const url = 'https://command-app-secure-staging.caring-philodendron.workers.dev/';
          let passed = false;
          for (let attempt = 0; attempt < 12; attempt++) {
            const response = await fetch(url, {redirect:'manual', headers:{'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36',Accept:'text/html'}});
            const location = response.headers.get('location') || '';
            if ([301,302,303,307,308].includes(response.status) && new URL(location,url).hostname.endsWith('.cloudflareaccess.com')) { passed = true; break; }
            await new Promise(resolve => setTimeout(resolve,5000));
          }
          if (!passed) throw new Error('Login redirect did not pass; Pages promotion stopped.');
          console.log('Access login redirect verified. React UI with live user sign-in still needs owner confirmation.');
          JS

  build:
    if: github.ref == 'refs/heads/main'
    needs: cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Typecheck
        run: pnpm check
      - name: Run automated tests
        run: pnpm test
      - name: Run Playwright end-to-end tests
        run: pnpm test:e2e
      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pages-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - name: Build static site
        run: pnpm build:static
      - name: Verify static build artifact
        run: pnpm verify:static
      - name: Start static preview server
        run: |
          PORT=4173 pnpm preview:static > /tmp/crosboard-preview.log 2>&1 &
          echo $! > /tmp/crosboard-preview.pid
      - name: Wait for static preview server
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/crosboard/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/crosboard-preview.log
          exit 1
      - name: Run Lighthouse audit
        run: pnpm audit:lighthouse
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-pages-${{ github.run_id }}
          path: artifacts/lighthouse/
          if-no-files-found: error
      - name: Make the official Pages URL open authenticated Command
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html import escape
          target = 'https://command-app-secure-staging.caring-philodendron.workers.dev/'
          html = '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=' + escape(target, quote=True) + '"><title>Command</title></head><body><main><h1>Command</h1><p>Opening your secure workspace.</p><a href="' + escape(target, quote=True) + '">Continue to Command</a></main></body></html>'
          Path('dist/public/index.html').write_text(html)
          assert '0;url=https://command-app-secure-staging.caring-philodendron.workers.dev/' in html
          assert '<a href="https://command-app-secure-staging.caring-philodendron.workers.dev/">' in html
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


name: Temporary lockfile refresh for security fixes
on:
  push:
    branches: [security/docker-runtime-hardening-20261103]
    paths: [pnpm-workspace.yaml, package.json, .github/workflows/refresh-security-lockfile.yml]
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'Marjanfarhad/crosboard' && github.ref == 'refs/heads/security/docker-runtime-hardening-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/docker-runtime-hardening-20261103
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile using pinned manifest
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit only regenerated lockfile to review branch
        run: |
          set -euo pipefail
          git add -- pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): lock additional patched production dependencies'
          git push origin HEAD:security/docker-runtime-hardening-20261103

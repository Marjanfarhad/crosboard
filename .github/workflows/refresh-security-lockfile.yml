name: Refresh security dependency lockfile

on:
  push:
    branches:
      - security/docker-runtime-hardening-20261103
    paths:
      - pnpm-workspace.yaml
      - .github/workflows/refresh-security-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: security-lockfile-refresh
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.repository == 'Marjanfarhad/crosboard' && github.ref == 'refs/heads/security/docker-runtime-hardening-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout security draft branch
        uses: actions/checkout@v4
        with:
          ref: security/docker-runtime-hardening-20261103
          persist-credentials: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile without scripts or installing dependencies
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Save only the lockfile to the draft branch
        run: |
          set -euo pipefail
          git add -- pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): lock patched critical transitive dependencies'
          git push origin HEAD:security/docker-runtime-hardening-20261103

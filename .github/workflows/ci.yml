name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Typecheck
        run: pnpm check
      - name: Run automated tests
        run: pnpm test
      - name: Run Playwright end-to-end tests
        run: pnpm test:e2e
      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - name: Build static site
        run: pnpm build:static
      - name: Verify static build artifact
        run: pnpm verify:static
      - name: Start static preview server
        run: |
          PORT=4173 pnpm preview:static > /tmp/crosboard-preview.log 2>&1 &
          echo $! > /tmp/crosboard-preview.pid
      - name: Wait for static preview server
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/crosboard/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/crosboard-preview.log
          exit 1
      - name: Run Lighthouse audit
        run: pnpm audit:lighthouse
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ github.run_id }}
          path: artifacts/lighthouse/
          if-no-files-found: error

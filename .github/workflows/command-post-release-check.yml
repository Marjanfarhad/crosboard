name: Command post-release verification
on:
  push:
    branches: [test/command-post-release-20261104]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check real official URL and Access login in desktop/mobile browsers
        run: pnpm exec playwright test --config playwright.live.config.ts
      - name: Check product/video saves, reload, notes, reminders and conflicts with mock API
        if: ${{ !cancelled() }}
        env:
          VITE_COMMAND_CLOUD_SYNC: 'true'
        run: pnpm exec playwright test --config playwright.cloud.config.ts
      - name: Resolve and verify existing live D1 binding without provisioning
        if: ${{ !cancelled() }}
        working-directory: ops/cloudflare-secure-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c07d8b1ea34ea6df240f291062a5ec1f
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          from pathlib import Path
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          def read(path):
              req=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/'+account+path,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
              with urllib.request.urlopen(req,timeout=30) as response:
                  value=json.load(response)
              if not value.get('success'):
                  raise SystemExit('Cloudflare read failed')
              return value['result']
          databases=read('/d1/database?per_page=100')
          selected=[db for db in databases if db.get('name')=='command-secure-staging']
          if len(selected)!=1:
              raise SystemExit('Live database could not be uniquely resolved')
          database_id=selected[0]['uuid']
          bindings=read('/workers/scripts/command-app-secure-staging/settings').get('bindings',[])
          if not any(b.get('name')=='DB' and b.get('type')=='d1' and b.get('id')==database_id for b in bindings):
              raise SystemExit('Worker DB binding does not match the selected database')
          config=json.loads(Path('wrangler.example.json').read_text())
          config['d1_databases'][0]['database_id']=database_id
          Path('wrangler.json').write_text(json.dumps(config))
          print('Confirmed: tests target the database bound to the deployed secure Worker. No configuration changed.')
          PY
      - name: Exercise live D1 persistence and synthetic account isolation, then clean up
        if: ${{ !cancelled() }}
        working-directory: ops/cloudflare-secure-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c07d8b1ea34ea6df240f291062a5ec1f
        run: node live-storage.test.mjs
      - name: Upload verification screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-post-release-verification
          path: |
            live-check-results/
            test-results/
          if-no-files-found: ignore

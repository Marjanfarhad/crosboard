name: Production billing check
on:
  pull_request:
    paths:
      - .github/workflows/production-billing-check.yml
permissions: {}
jobs:
  inspect:
    if: github.head_ref == 'ops/production-billing-check' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect Cloudflare production and billing
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from datetime import datetime, timezone
          from urllib.parse import urlencode
          base = 'https://api.cloudflare.com/client/v4/accounts/c07d8b1ea34ea6df240f291062a5ec1f'
          today = datetime.now(timezone.utc).replace(hour=0, minute=0, second=0, microsecond=0)
          query = urlencode({'metrics':'workersRequests', 'since':today.isoformat(), 'time_delta':'hour'})
          token = os.environ['CF_TOKEN']
          print('Credential present:', bool(token))
          print('Surrounding whitespace:', token != token.strip())
          for label, url in [('User token', 'https://api.cloudflare.com/client/v4/user/tokens/verify'), ('Account token', base + '/tokens/verify')]:
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token.strip()})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      data = json.load(response)
                  print(label, 'status:', data.get('result', {}).get('status'))
              except urllib.error.HTTPError as error:
                  codes = [item.get('code') for item in json.load(error).get('errors', [])]
                  print(label, 'HTTP', error.code, 'Cloudflare codes', codes)
          checks = {
              'Production Access': '/access/apps/bd8babc7-75d1-42fe-a0f1-bed1bdaeaf10',
              'Subscriptions': '/subscriptions',
              'Workers usage': '/billing/usage?' + query,
          }
          failed = False
          for label, path in checks.items():
              req = urllib.request.Request(base + path, headers={'Authorization': 'Bearer ' + token.strip()})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      data = json.load(response)
                  if not data.get('success'):
                      raise ValueError('Cloudflare reported failure')
                  result = data['result']
                  if label == 'Subscriptions':
                      print(label, [(x.get('rate_plan', {}).get('public_name'), x.get('price'), x.get('state')) for x in result])
                  elif label == 'Workers usage':
                      print(label, json.dumps(result)[:3000])
                  else:
                      print(label, 'read succeeded')
              except urllib.error.HTTPError as error:
                  print(label, 'HTTP', error.code)
                  failed = True
          raise SystemExit(int(failed))
          PY
      - name: Verify anonymous production API requests require owner login
        run: |
          node --input-type=module - <<'JS'
          for (const path of ['/api/account', '/api/workspace']) {
            const response = await fetch('https://command-app-production.caring-philodendron.workers.dev' + path, {redirect:'manual'});
            const host = new URL(response.headers.get('location') || '/', response.url).hostname;
            console.log(path, response.status, host);
            if (![301,302,303,307,308].includes(response.status) || host !== 'frosty-frog-d5d8.cloudflareaccess.com') process.exitCode = 1;
          }
          JS
      - name: Compare Access signing key endpoints
        run: |
          node --input-type=module - <<'JS'
          for (const host of ['frosty-frog-d5d8.cloudflareaccess.com','command-app-production.caring-philodendron.workers.dev']) {
            const r = await fetch('https://' + host + '/cdn-cgi/access/certs', {redirect:'manual',headers:{Accept:'application/json'}});
            const d = await r.json().catch(()=>({}));
            console.log('KEY CHECK',host,r.status,r.headers.get('content-type'),d.keys?.map(k=>k.kid)??[]);
          }
          JS

name: Production billing check
on:
  pull_request:
    paths:
      - .github/workflows/production-billing-check.yml
permissions: {}
jobs:
  inspect:
    if: github.head_ref == 'ops/production-billing-check' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect Cloudflare production and billing
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from datetime import datetime, timezone
          from urllib.parse import urlencode
          base = 'https://api.cloudflare.com/client/v4/accounts/c07d8b1ea34ea6df240f291062a5ec1f'
          today = datetime.now(timezone.utc).replace(hour=0, minute=0, second=0, microsecond=0)
          query = urlencode({'metrics':'workersRequests', 'since':today.isoformat(), 'time_delta':'hour'})
          checks = {
              'Production Access': '/access/apps/bd8babc7-75d1-42fe-a0f1-bed1bdaeaf10',
              'Subscriptions': '/subscriptions',
              'Workers usage': '/billing/usage?' + query,
          }
          failed = False
          for label, path in checks.items():
              req = urllib.request.Request(base + path, headers={'Authorization': 'Bearer ' + os.environ['CF_TOKEN']})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      data = json.load(response)
                  if not data.get('success'):
                      raise ValueError('Cloudflare reported failure')
                  result = data['result']
                  if label == 'Subscriptions':
                      print(label, [(x.get('rate_plan', {}).get('public_name'), x.get('price'), x.get('state')) for x in result])
                  elif label == 'Workers usage':
                      print(label, 'requests reported today UTC:', sum(x.get('workersRequests', 0) for x in result), 'observations:', len(result))
                  else:
                      print(label, 'read succeeded')
              except urllib.error.HTTPError as error:
                  print(label, 'HTTP', error.code)
                  failed = True
          raise SystemExit(int(failed))
          PY
